[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pantry-common"
version = "0.1.0"
dependencies = ["fastapi>=0.115,<1", "PyJWT>=2.9,<3", "httpx>=0.28,<1", "python-dotenv>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["services"]
include = ["pantry_common*"]
