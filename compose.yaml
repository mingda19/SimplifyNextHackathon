name: simplifynext

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simplifynext}
      POSTGRES_USER: ${POSTGRES_USER:-simplifynext}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplifynext}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 15

  inventory:
    build:
      context: ./services/inventory
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-simplifynext}:${POSTGRES_PASSWORD:-simplifynext}@postgres:5432/${POSTGRES_DB:-simplifynext}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${INVENTORY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
